<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 30px;
      background-color: #ffffff;
      color: #1e293b;
      line-height: 1.6;
    }
    .card {
      max-width: 600px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 { font-size: 1.8rem; color: #0f172a; margin: 0 0 8px; }
    p { color: #475569; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to the Library</h1>
    <p>Select a book from the list on the left to see its author, year of publication, genre and synopsis here.</p>
  </div>
</body>
</html>
