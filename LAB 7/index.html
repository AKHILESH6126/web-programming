<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(135deg, #14345a, #397b8c); font-family: Arial, sans-serif; }
    main { width: min(460px, calc(100% - 36px)); padding: 32px; border-radius: 18px; background: #fff; box-shadow: 0 16px 38px rgba(0, 0, 0, .28); }
    h1 { margin: 0 0 8px; color: #123b62; text-align: center; }
    .intro { margin: 0 0 24px; color: #64748b; text-align: center; }
    label { display: block; margin: 15px 0 7px; color: #334155; font-weight: bold; }
    input { width: 100%; padding: 12px; border: 1px solid #94a3b8; border-radius: 7px; font-size: 1rem; }
    .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 22px; }
    button { padding: 12px; border: 0; border-radius: 7px; background: #176b87; color: white; cursor: pointer; font-size: 1rem; font-weight: bold; }
    button:hover { background: #0f5068; }
    .clear { background: #64748b; } .clear:hover { background: #475569; }
    #result { min-height: 55px; margin-top: 22px; padding: 16px; border-left: 5px solid #176b87; background: #eaf7fa; color: #123b62; font-size: 1.15rem; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Math Calculator</h1>
    <p class="intro">Enter two numbers and choose an operation.</p>

    <form id="calculatorForm">
      <label for="number1">First Number</label>
      <input id="number1" type="number" step="any" required>

      <label for="number2">Second Number</label>
      <input id="number2" type="number" step="any" required>

      <div class="buttons">
        <button type="button" onclick="calculate('+')">Addition (+)</button>
        <button type="button" onclick="calculate('-')">Subtraction (-)</button>
        <button type="button" onclick="calculate('*')">Multiplication (×)</button>
        <button type="button" onclick="calculate('/')">Division (÷)</button>
        <button class="clear" type="reset" onclick="clearResult()">Clear</button>
      </div>
    </form>

    <div id="result" aria-live="polite">Result will appear here.</div>
  </main>

  <script>
    function calculate(operator) {
      const first = Number(document.getElementById('number1').value);
      const second = Number(document.getElementById('number2').value);
      const resultBox = document.getElementById('result');

      if (document.getElementById('number1').value === '' || document.getElementById('number2').value === '') {
        resultBox.textContent = 'Please enter both numbers.';
        return;
      }
      if (operator === '/' && second === 0) {
        resultBox.textContent = 'Division by zero is not allowed.';
        return;
      }

      let answer;
      if (operator === '+') answer = first + second;
      if (operator === '-') answer = first - second;
      if (operator === '*') answer = first * second;
      if (operator === '/') answer = first / second;
      resultBox.textContent = `Result: ${first} ${operator} ${second} = ${answer}`;
    }

    function clearResult() {
      document.getElementById('result').textContent = 'Result will appear here.';
    }
  </script>
</body>
</html>
