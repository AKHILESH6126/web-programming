<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chalkboard Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="board">
    <h1>Chalkboard Calculator</h1>
    <form id="calc-form" novalidate>
      <label for="num1">First number</label>
      <input type="number" id="num1" step="any" placeholder="e.g. 12" required>

      <label for="operation">Operation</label>
      <select id="operation">
        <option value="add">Addition (+)</option>
        <option value="subtract">Subtraction (&minus;)</option>
        <option value="multiply">Multiplication (&times;)</option>
        <option value="divide">Division (&divide;)</option>
      </select>

      <label for="num2">Second number</label>
      <input type="number" id="num2" step="any" placeholder="e.g. 4" required>

      <div class="buttons">
        <button type="submit">Calculate</button>
        <button type="reset" id="clear" class="ghost">Clear</button>
      </div>
    </form>

    <p id="result" role="status" aria-live="polite">Enter two numbers to begin.</p>

    <h2>History</h2>
    <ul id="history"><li class="empty">Nothing calculated yet.</li></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
