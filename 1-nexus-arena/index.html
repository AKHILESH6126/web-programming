<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS ARENA — 3D Rock Paper Scissors</title>
<style>
  :root{
    --cyan:#22e7ff; --magenta:#ff3ca6; --gold:#ffd23f; --lime:#7dff8a; --red:#ff5b6e;
    --ink:#e8f4ff; --dim:#8aa0b8;
    --glass:rgba(14,22,40,.55); --stroke:rgba(120,180,255,.18);
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden; background:#05070f; color:var(--ink); font-family:var(--font)}
  #app{position:fixed; inset:0}
  canvas{display:block; position:absolute; inset:0; touch-action:none}

  /* ---------- HUD ---------- */
  .hud{position:absolute; inset:0; pointer-events:none; z-index:5}
  .topbar{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; gap:12px;
  }
  .brand{display:flex; flex-direction:column; line-height:1}
  .brand b{font-size:20px; letter-spacing:.28em; font-weight:800;
    background:linear-gradient(90deg,var(--cyan),var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 18px rgba(80,200,255,.25)}
  .brand span{font-family:var(--mono); font-size:10px; letter-spacing:.34em; color:var(--dim); margin-top:6px}

  .scorebar{display:flex; gap:10px; pointer-events:auto}
  .card{
    background:var(--glass); border:1px solid var(--stroke); border-radius:14px; padding:9px 14px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); text-align:center; min-width:70px;
    box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .card .lbl{font-family:var(--mono); font-size:9px; letter-spacing:.22em; color:var(--dim)}
  .card .val{font-size:22px; font-weight:800; margin-top:2px}
  .card.you .val{color:var(--cyan)} .card.ai .val{color:var(--magenta)} .card.streak .val{color:var(--gold)}

  /* ---------- center stage text ---------- */
  .stage{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none}
  .countdown{font-size:min(26vw,190px); font-weight:900; font-family:var(--mono);
    color:#fff; text-shadow:0 0 40px var(--cyan),0 0 90px var(--magenta); opacity:0; transform:scale(.4); margin-top:-8vh}
  .verdict{font-size:min(13vw,88px); font-weight:900; letter-spacing:.04em; opacity:0; transform:translateY(20px) scale(.9);
    text-shadow:0 0 40px rgba(0,0,0,.6)}
  .verdict small{display:block; font-size:.28em; letter-spacing:.34em; font-family:var(--mono); color:var(--dim); margin-top:10px; font-weight:600}

  /* ---------- bottom controls ---------- */
  .dock{position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 16px 26px; pointer-events:none}
  .prompt{font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase}
  .choices{display:flex; gap:16px; pointer-events:auto; flex-wrap:wrap; justify-content:center}
  .btn{
    position:relative; width:104px; height:104px; border-radius:22px; cursor:pointer;
    background:var(--glass); border:1px solid var(--stroke); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:transform .16s cubic-bezier(.2,.9,.3,1.4), box-shadow .2s, border-color .2s, opacity .3s;
    box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .btn .ico{font-size:40px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .btn .nm{font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--dim)}
  .btn .key{position:absolute; top:8px; right:10px; font-family:var(--mono); font-size:10px; color:var(--dim); opacity:.7}
  .btn:hover{transform:translateY(-6px); border-color:rgba(140,210,255,.5); box-shadow:0 18px 44px rgba(20,120,220,.28)}
  .btn:active{transform:translateY(-2px) scale(.97)}
  .btn.rock:hover{box-shadow:0 18px 44px rgba(180,140,90,.35)}
  .btn.paper:hover{box-shadow:0 18px 44px rgba(120,200,255,.35)}
  .btn.scissors:hover{box-shadow:0 18px 44px rgba(255,90,160,.35)}
  .choices.locked{opacity:.35; filter:saturate(.4); pointer-events:none}

  /* ---------- side buttons ---------- */
  .tools{position:absolute; bottom:26px; right:20px; display:flex; gap:10px; pointer-events:auto}
  .chip{pointer-events:auto; background:var(--glass); border:1px solid var(--stroke); color:var(--dim);
    border-radius:12px; padding:9px 12px; font-family:var(--mono); font-size:11px; letter-spacing:.12em; cursor:pointer;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:.2s}
  .chip:hover{color:var(--ink); border-color:rgba(140,210,255,.5)}

  /* ---------- loader / intro ---------- */
  #loader{position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%, #0b1226, #05070f); gap:22px; transition:opacity .6s}
  #loader.hide{opacity:0; pointer-events:none}
  .ring{width:64px; height:64px; border-radius:50%; border:3px solid rgba(120,180,255,.15); border-top-color:var(--cyan); animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{font-family:var(--mono); font-size:12px; letter-spacing:.28em; color:var(--dim)}
  #loader h1{font-size:26px; letter-spacing:.3em; font-weight:800;
    background:linear-gradient(90deg,var(--cyan),var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .startbtn{margin-top:8px; pointer-events:auto; padding:14px 34px; border-radius:40px; cursor:pointer; border:1px solid rgba(140,210,255,.4);
    background:linear-gradient(90deg, rgba(34,231,255,.18), rgba(255,60,166,.18)); color:#fff; font-weight:700; letter-spacing:.22em;
    font-family:var(--mono); font-size:13px; transition:.2s; box-shadow:0 0 30px rgba(60,180,255,.25)}
  .startbtn:hover{transform:translateY(-2px); box-shadow:0 0 46px rgba(60,180,255,.4)}

  .hint{position:absolute; top:78px; left:0; right:0; text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--dim); pointer-events:none}

  @media (max-width:520px){
    .btn{width:88px; height:88px} .btn .ico{font-size:32px}
    .brand b{font-size:15px} .card{min-width:58px; padding:7px 10px} .card .val{font-size:18px}
    .tools{bottom:auto; top:16px; right:14px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important; transition-duration:.05ms!important} }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud" aria-hidden="false">
  <div class="topbar">
    <div class="brand"><b>NEXUS ARENA</b><span>ROCK · PAPER · SCISSORS</span></div>
    <div class="scorebar" role="status" aria-live="off">
      <div class="card you"><div class="lbl">YOU</div><div class="val" id="scoreYou">0</div></div>
      <div class="card ai"><div class="lbl">NEXUS AI</div><div class="val" id="scoreAI">0</div></div>
      <div class="card streak"><div class="lbl">STREAK</div><div class="val" id="scoreStreak">0</div></div>
    </div>
  </div>

  <div class="hint" id="hint">DRAG TO ORBIT · PICK YOUR WEAPON BELOW OR PRESS R / P / S</div>

  <div class="stage">
    <div class="countdown" id="countdown"></div>
    <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
  </div>

  <div class="dock">
    <div class="prompt" id="prompt">CHOOSE YOUR WEAPON</div>
    <div class="choices" id="choices">
      <button class="btn rock" data-move="rock" aria-label="Play Rock (press R)"><span class="key">R</span><span class="ico">🪨</span><span class="nm">ROCK</span></button>
      <button class="btn paper" data-move="paper" aria-label="Play Paper (press P)"><span class="key">P</span><span class="ico">📄</span><span class="nm">PAPER</span></button>
      <button class="btn scissors" data-move="scissors" aria-label="Play Scissors (press S)"><span class="key">S</span><span class="ico">✂️</span><span class="nm">SCISSORS</span></button>
    </div>
  </div>

  <div class="tools">
    <button class="chip" id="muteBtn" aria-label="Toggle sound">♪ SOUND: ON</button>
    <button class="chip" id="resetBtn" aria-label="Reset score">⟲ RESET</button>
  </div>
</div>

<div id="loader">
  <h1>NEXUS ARENA</h1>
  <div class="ring" id="ring"></div>
  <p id="loadMsg">LOADING 3D ENGINE…</p>
  <button class="startbtn" id="startBtn" style="display:none">ENTER ARENA</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ============================================================= *
 *  NEXUS ARENA — 3D Rock Paper Scissors, played with 3D HANDS.
 *  Two gloved-white articulated hands pump "3·2·1" then snap
 *  into rock / paper / scissors. Single file; Three.js via CDN
 *  (ES modules) — requires HTTP hosting, not raw file://.
 * ============================================================= */

const CANVAS_PARENT = document.getElementById('app');
const reduceMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- Renderer / Scene / Camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
CANVAS_PARENT.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#070a16');
scene.fog = new THREE.Fog('#070a16', 12, 34);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 3.1, 9.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6; controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.54;
controls.minPolarAngle = Math.PI * 0.18;
controls.enablePan = false;
controls.target.set(0, 1.5, 0);
controls.autoRotate = true; controls.autoRotateSpeed = 0.7;

/* ---------- Camera lock: fixed front framing during a duel ---------- */
let cameraLocked = false;
const DUEL_CAM_POS = new THREE.Vector3(0, 2.3, 8.8);   // clean, centered front view
const DUEL_CAM_TGT = new THREE.Vector3(0, 1.7, 0);
const _camFrom = new THREE.Vector3(), _tgtFrom = new THREE.Vector3();
function flyCamera(toPos, toTgt, dur){
  cameraLocked = true;
  _camFrom.copy(camera.position); _tgtFrom.copy(controls.target);
  return tween(dur, p=>{
    camera.position.lerpVectors(_camFrom, toPos, p);
    controls.target.lerpVectors(_tgtFrom, toTgt, p);
    camera.lookAt(controls.target);
  }, easeInOut);
}

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight('#9fd0ff', '#12142a', 0.7));
const key = new THREE.DirectionalLight('#ffffff', 2.2);
key.position.set(5, 9, 6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=1; key.shadow.camera.far=40;
key.shadow.camera.left=-10; key.shadow.camera.right=10; key.shadow.camera.top=10; key.shadow.camera.bottom=-10;
key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight('#bcd6ff', 0.5); fill.position.set(-6,4,3); scene.add(fill);
const rimC = new THREE.PointLight('#22e7ff', 55, 30); rimC.position.set(-7, 3, -3); scene.add(rimC);
const rimM = new THREE.PointLight('#ff3ca6', 55, 30); rimM.position.set(7, 2, -4); scene.add(rimM);

/* ---------- Ground + grid ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(26, 64),
  new THREE.MeshStandardMaterial({ color:'#0a0f1f', roughness:.85, metalness:.35 })
);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(40, 40, '#1c60a0', '#0e2036');
grid.material.transparent = true; grid.material.opacity = 0.35;
scene.add(grid);
const ringGlow = new THREE.Mesh(
  new THREE.RingGeometry(2.9, 3.15, 64),
  new THREE.MeshBasicMaterial({ color:'#22e7ff', side:THREE.DoubleSide, transparent:true, opacity:.5 })
);
ringGlow.rotation.x = -Math.PI/2; ringGlow.position.y = 0.01; scene.add(ringGlow);

/* ---------- Post-processing (bloom) ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.85, 0.25);
composer.addPass(bloom);

/* ============================================================= *
 *  HAND MODEL — procedural, articulated, gloved white
 *  Structure: palm + 4 three-joint fingers + 2-joint thumb.
 *  Each joint is a Group we rotate to curl/extend, so one hand
 *  can form any of rock / paper / scissors.
 * ============================================================= */
const GLOVE = new THREE.MeshStandardMaterial({ color:'#eef2f8', roughness:.48, metalness:.05 });
function cuffMat(hex){ return new THREE.MeshStandardMaterial({ color:hex, roughness:.35, metalness:.25, emissive:hex, emissiveIntensity:.35 }); }

// one phalanx: a capsule in a rotatable joint group; returns {joint, tip}
function phalanx(parent, span, r){
  const joint = new THREE.Group(); parent.add(joint);
  const len = Math.max(0.02, span - 2*r);
  const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 14), GLOVE);
  mesh.position.y = span/2; mesh.castShadow = true; mesh.receiveShadow = true;
  joint.add(mesh);
  // soft knuckle bump
  const knuck = new THREE.Mesh(new THREE.SphereGeometry(r*1.05, 12, 10), GLOVE);
  knuck.castShadow = true; joint.add(knuck);
  const tip = new THREE.Group(); tip.position.y = span; joint.add(tip);
  return { joint, tip };
}
// chain of phalanges; returns {base, joints:[...]}
function makeDigit(spans, radii){
  const base = new THREE.Group();
  const joints = []; let anchor = base;
  for(let i=0;i<spans.length;i++){ const p = phalanx(anchor, spans[i], radii[i]); joints.push(p.joint); anchor = p.tip; }
  // rounded fingertip
  const tipCap = new THREE.Mesh(new THREE.SphereGeometry(radii[radii.length-1]*0.95,12,10), GLOVE);
  tipCap.castShadow = true; anchor.add(tipCap);
  return { base, joints };
}

function makeHand(tintHex){
  const hand = new THREE.Group();

  // palm — slightly domed rounded box
  const palm = new THREE.Mesh(new RoundedBoxGeometry(1.02, 1.15, 0.4, 5, 0.18), GLOVE);
  palm.castShadow = true; palm.receiveShadow = true;
  hand.add(palm);
  // fleshy pad below the thumb
  const pad = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 14), GLOVE);
  pad.scale.set(1, 1.15, 0.7); pad.position.set(-0.34, -0.18, 0.12); pad.castShadow = true; hand.add(pad);

  const rig = { fingers:[], thumb:null, thumbBase:null, palm };

  // four fingers along the top knuckle line
  const fingerX = [-0.36, -0.12, 0.12, 0.36];
  const spans = [ [0.46,0.32,0.24], [0.50,0.36,0.26], [0.46,0.34,0.25], [0.34,0.26,0.20] ];
  const radii = [ [0.115,0.10,0.088], [0.12,0.105,0.09], [0.115,0.10,0.088], [0.10,0.088,0.078] ];
  fingerX.forEach((x,i)=>{
    const f = makeDigit(spans[i], radii[i]);
    f.base.position.set(x, 0.52, 0.03);
    f.base.userData.splayBase = (-x)*0.10;     // slight natural fan
    f.base.rotation.z = f.base.userData.splayBase;
    hand.add(f.base); rig.fingers.push(f);
  });

  // thumb — mounted on a base group on the -x side, angled out & forward
  const thumbBase = new THREE.Group();
  thumbBase.position.set(-0.5, -0.06, 0.16);
  thumbBase.rotation.set(0.35, 0.25, 0.9);    // (x forward, y toward palm, z out to the side)
  hand.add(thumbBase);
  const thumb = makeDigit([0.34,0.30], [0.125,0.10]);
  thumbBase.add(thumb.base);
  rig.thumb = thumb; rig.thumbBase = thumbBase;
  rig.thumbBaseZ = 0.9;

  // gloved cuff / wrist
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.44, 0.5, 24), cuffMat(tintHex));
  cuff.position.y = -0.85; cuff.castShadow = true; hand.add(cuff);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.53, 0.075, 12, 28), cuffMat(tintHex));
  band.position.y = -0.62; band.rotation.x = Math.PI/2; band.castShadow = true; hand.add(band);

  hand.userData.rig = rig;
  applyPose(hand, POSES.rock, true);   // start as a fist
  return hand;
}

/* ---------- Poses ---------- *
 * curl = [MCP, PIP, DIP] rotation.x per finger (index,middle,ring,pinky)
 * splay = extra base rotation.z (spreads fingers apart)
 * thumb = [joint0, joint1] rotation.x ; thumbZ = thumbBase.rotation.z (fold across / spread) */
const OPEN = [0.06,0.04,0.03];
const CURL = [1.48,1.75,0.72];
const POSES = {
  paper: {
    curl:[OPEN,OPEN,OPEN,OPEN],
    splay:[0.16,0.05,-0.05,-0.15],
    thumb:[0.15,0.10], thumbZ:1.2
  },
  rock: {
    curl:[CURL,CURL,CURL,CURL],
    splay:[0,0,0,0],
    thumb:[0.85,0.75], thumbZ:0.28
  },
  scissors: {
    curl:[OPEN,OPEN,CURL,CURL],
    splay:[0.42,-0.26,0.02,-0.02],
    thumb:[0.95,0.80], thumbZ:0.24
  }
};

function applyPose(hand, pose, immediate){
  const rig = hand.userData.rig;
  for(let i=0;i<4;i++){
    const f = rig.fingers[i];
    f.joints[0].rotation.x = pose.curl[i][0];
    f.joints[1].rotation.x = pose.curl[i][1];
    f.joints[2].rotation.x = pose.curl[i][2];
    f.base.rotation.z = f.base.userData.splayBase + pose.splay[i];
  }
  rig.thumb.joints[0].rotation.x = pose.thumb[0];
  rig.thumb.joints[1].rotation.x = pose.thumb[1];
  rig.thumbBase.rotation.z = pose.thumbZ;
  hand.userData.pose = pose;
}
function lerpPose(a,b,t){
  const mix=(x,y)=>x+(y-x)*t;
  return {
    curl: a.curl.map((row,i)=> row.map((v,j)=> mix(v,b.curl[i][j]))),
    splay: a.splay.map((v,i)=> mix(v,b.splay[i])),
    thumb: a.thumb.map((v,i)=> mix(v,b.thumb[i])),
    thumbZ: mix(a.thumbZ,b.thumbZ)
  };
}
async function morphPose(hand, from, to, dur){
  await tween(dur, p=> applyPose(hand, lerpPose(from,to,p)), back);
}

/* ---------- Idle menu: three hands showing each sign ---------- */
const idleGroup = new THREE.Group(); scene.add(idleGroup);
const idleItems = [];
const idleSpots = { rock:-2.7, paper:0, scissors:2.7 };
for(const name of ['rock','paper','scissors']){
  const h = makeHand(name==='paper' ? '#9fb4d8' : name==='rock' ? '#22e7ff' : '#ff3ca6');
  applyPose(h, POSES[name], true);
  h.position.set(idleSpots[name], 1.7, 0);
  h.scale.setScalar(0.66);
  h.userData.name = name; h.userData.phase = Math.random()*6.28;
  idleGroup.add(h); idleItems.push(h);
}

/* ---------- Duel hands ---------- */
let pHand=null, aHand=null, pHolder=null, aHolder=null;
function clearDuel(){
  for(const g of [pHolder,aHolder]){ if(g){ scene.remove(g); g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); } }
  pHand=aHand=pHolder=aHolder=null;
}
const DUEL_Y = 1.7, DUEL_X = 2.35;
function spawnDuel(){
  pHolder = new THREE.Group(); aHolder = new THREE.Group();
  pHand = makeHand('#22e7ff'); aHand = makeHand('#ff3ca6');
  // fingers point toward center: player's toward +x, ai's toward -x
  pHand.rotation.z = -Math.PI/2; pHand.scale.setScalar(0.9);
  aHand.rotation.z =  Math.PI/2; aHand.scale.setScalar(0.9);
  pHolder.position.set(-DUEL_X, DUEL_Y, 0);
  aHolder.position.set( DUEL_X, DUEL_Y, 0);
  pHolder.add(pHand); aHolder.add(aHand);
  scene.add(pHolder, aHolder);
}

/* ---------- Particle burst ---------- */
let bursts = [];
function burst(color, at){
  const N = reduceMotion ? 40 : 170;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3), vel = [];
  for(let i=0;i<N;i++){
    pos[i*3]=at.x; pos[i*3+1]=at.y; pos[i*3+2]=at.z;
    const dir = new THREE.Vector3(Math.random()-.5, Math.random()*0.9+0.1, Math.random()-.5).normalize();
    vel.push(dir.multiplyScalar(2.5+Math.random()*4));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ color, size:0.14, transparent:true, opacity:1, depthWrite:false, blending:THREE.AdditiveBlending });
  const pts = new THREE.Points(geo, mat); scene.add(pts);
  bursts.push({ pts, vel, life:0, max:1.2 });
}
function updateBursts(dt){
  for(const b of bursts){
    b.life += dt;
    const p = b.pts.geometry.attributes.position;
    for(let i=0;i<b.vel.length;i++){
      b.vel[i].y -= 6*dt;
      p.array[i*3]   += b.vel[i].x*dt;
      p.array[i*3+1] += b.vel[i].y*dt;
      p.array[i*3+2] += b.vel[i].z*dt;
    }
    p.needsUpdate = true;
    b.pts.material.opacity = Math.max(0, 1 - b.life/b.max);
  }
  bursts = bursts.filter(b=>{ if(b.life>=b.max){ scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); return false;} return true; });
}

/* ============================================================= *
 *  AUDIO — WebAudio synthesis, tuned to feel organic
 *  (filtered-noise "whumps" & "pats" for the physical hits,
 *   soft detuned tones with gentle envelopes for outcomes).
 * ============================================================= */
const Audio = (()=>{
  let ctx=null, noise=null, muted=false, master=null;
  function ensure(){
    if(!ctx){
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      // 1s white-noise buffer, reused for all textured sounds
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  // filtered noise burst — the "physical" texture (whumps, pats)
  function noiseHit(t0, dur, type, freq, q, gain, sweepTo){
    const c=ensure(); const src=c.createBufferSource(); src.buffer=noise; src.loop=true;
    const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq, c.currentTime+t0);
    if(sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, c.currentTime+t0+dur);
    f.Q.value=q;
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001, c.currentTime+t0);
    g.gain.exponentialRampToValueAtTime(gain, c.currentTime+t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
    src.connect(f).connect(g).connect(master);
    src.start(c.currentTime+t0); src.stop(c.currentTime+t0+dur+0.03);
  }
  // warm tone — soft attack, slight detune for body
  function tone(t0, dur, freq, type='sine', gain=0.16, detune=6){
    const c=ensure();
    for(const dt of [-detune, detune]){
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.value=freq; o.detune.value=dt;
      g.gain.setValueAtTime(0.0001, c.currentTime+t0);
      g.gain.linearRampToValueAtTime(gain, c.currentTime+t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
      o.connect(g).connect(master); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.03);
    }
  }
  return {
    setMuted:v=>muted=v, isMuted:()=>muted, resume:ensure,
    tick(){ if(muted)return; noiseHit(0,0.05,'bandpass',1400,1,0.10); },
    // fist pump: soft low "whump" of air + a muted thud
    pump(){ if(muted)return; noiseHit(0,0.16,'lowpass',420,0.6,0.22,180); tone(0,0.14,90,'sine',0.10,0); },
    // reveal / open: a light skin "pat" + tiny click
    reveal(){ if(muted)return; noiseHit(0,0.10,'bandpass',900,0.8,0.20,600); noiseHit(0.01,0.05,'highpass',2600,0.7,0.06); tone(0,0.12,150,'triangle',0.07,0); },
    win(){ if(muted)return; [523.25,659.25,783.99,1046.5].forEach((f,i)=> tone(i*0.10,0.34,f,'triangle',0.16,7)); },
    lose(){ if(muted)return; [392,311,247].forEach((f,i)=> tone(i*0.12,0.42,f,'sine',0.16,4)); },
    draw(){ if(muted)return; noiseHit(0,0.08,'bandpass',700,0.9,0.14); tone(0.10,0.22,330,'sine',0.12,0); }
  };
})();

/* ============================================================= *
 *  GAME STATE
 * ============================================================= */
const state = { you:0, ai:0, streak:0, best:0, busy:false, started:false };
const el = id => document.getElementById(id);
function loadStats(){
  try{ const s = JSON.parse(localStorage.getItem('nexus_arena')||'{}');
    state.you=s.you||0; state.ai=s.ai||0; state.best=s.best||0; state.streak=s.streak||0;
  }catch(_){}
  paintScore();
}
function saveStats(){ try{ localStorage.setItem('nexus_arena', JSON.stringify({you:state.you,ai:state.ai,best:state.best,streak:state.streak})); }catch(_){} }
function paintScore(){ el('scoreYou').textContent=state.you; el('scoreAI').textContent=state.ai; el('scoreStreak').textContent=state.streak; }

/* ---------- tween + easing helpers ---------- */
function tween(dur, onUpdate, ease=t=>t){
  return new Promise(res=>{
    if(reduceMotion){ onUpdate(1); return res(); }
    const start=performance.now();
    (function step(now){ let p=Math.min(1,(now-start)/dur); onUpdate(ease(p)); p<1?requestAnimationFrame(step):res(); })(performance.now());
  });
}
const easeOut = t=>1-Math.pow(1-t,3);
const easeInOut = t=> t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const back = t=>{ const c=1.70158; return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); };
const wait = ms=>new Promise(r=>setTimeout(r, reduceMotion?Math.min(ms,120):ms));

const BEATS = { rock:'scissors', paper:'rock', scissors:'paper' };
const NAMES = { rock:'ROCK', paper:'PAPER', scissors:'SCISSORS' };
function judge(a,b){ if(a===b) return 'draw'; return BEATS[a]===b ? 'win':'lose'; }

/* ---------- round flow ---------- */
async function play(move){
  if(state.busy || !state.started) return;
  state.busy = true;
  Audio.resume(); Audio.tick();
  el('choices').classList.add('locked');
  el('hint').style.opacity='0';
  controls.autoRotate = false;
  controls.enabled = false;               // no user drag mid-duel
  idleGroup.visible = false;

  const ai = ['rock','paper','scissors'][Math.floor(Math.random()*3)];
  spawnDuel();

  // lock the camera to a clean front angle so the throw is always readable
  await flyCamera(DUEL_CAM_POS, DUEL_CAM_TGT, reduceMotion?60:520);

  // pump "3 · 2 · 1" as fists, then throw the signs
  await pumpAndReveal(move, ai);

  const outcome = judge(move, ai);
  showVerdict(outcome, move, ai);
  applyOutcomeFx(outcome);

  if(outcome==='win'){ state.you++; state.streak++; state.best=Math.max(state.best,state.streak); Audio.win(); }
  else if(outcome==='lose'){ state.ai++; state.streak=0; Audio.lose(); }
  else { Audio.draw(); }
  paintScore(); saveStats();

  await wait(1750);
  await tween(380, p=>{ const s=1-p; if(pHolder)pHolder.scale.setScalar(s); if(aHolder)aHolder.scale.setScalar(s); });
  clearDuel();
  hideVerdict();
  idleGroup.visible = true;
  cameraLocked = false;                    // hand orbit control back to the user
  controls.enabled = true;
  controls.autoRotate = true;
  el('choices').classList.remove('locked');
  el('prompt').textContent = 'CHOOSE YOUR WEAPON';
  state.busy = false;
}

async function pumpAndReveal(move, ai){
  const c = el('countdown');
  const flash = n=>{ c.textContent=n; c.style.opacity='1'; c.style.transform='scale(1)';
    tween(360, p=>{ c.style.opacity=String(1-p*0.7); }); };

  // three pump beats
  for(const n of ['3','2','1']){
    flash(n); Audio.pump();
    await tween(reduceMotion?120:340, p=>{
      const dip = Math.sin(p*Math.PI);           // 0→1→0
      pHolder.position.y = DUEL_Y - 0.5*dip;
      aHolder.position.y = DUEL_Y - 0.5*dip;
      pHand.rotation.x =  0.5*dip;                // wrist flick
      aHand.rotation.x =  0.5*dip;
    });
  }

  // "SHOOT!" — final drop, then snap open into the sign
  c.textContent='SHOOT!'; c.style.opacity='1'; c.style.transform='scale(1)'; Audio.pump();
  await tween(reduceMotion?100:190, p=>{
    const y = DUEL_Y - 0.5*easeOut(p);
    pHolder.position.y=y; aHolder.position.y=y;
    pHand.rotation.x = 0.5*(1-easeOut(p)); aHand.rotation.x = 0.5*(1-easeOut(p));
  });
  Audio.reveal();
  await Promise.all([
    morphPose(pHand, POSES.rock, POSES[move], reduceMotion?60:220),
    morphPose(aHand, POSES.rock, POSES[ai],   reduceMotion?60:220)
  ]);
  // little settle back up + forward accent
  await tween(reduceMotion?80:240, p=>{
    const y = (DUEL_Y-0.5) + 0.5*easeOut(p);
    pHolder.position.y=y; aHolder.position.y=y;
    pHand.rotation.x = 0; aHand.rotation.x = 0;
  });
  tween(340, p=>{ c.style.opacity=String(1-p); });
}

function applyOutcomeFx(outcome){
  const pAt = new THREE.Vector3(-DUEL_X+0.7, DUEL_Y, 0);
  const aAt = new THREE.Vector3( DUEL_X-0.7, DUEL_Y, 0);
  if(outcome==='win'){ bloom.strength=1.35; burst(new THREE.Color('#7dff8a'), pAt); celebrate(pHolder); droop(aHolder); }
  else if(outcome==='lose'){ bloom.strength=1.2; burst(new THREE.Color('#ff5b6e'), aAt); celebrate(aHolder); droop(pHolder); }
  else { bloom.strength=1.0; burst(new THREE.Color('#ffd23f'), new THREE.Vector3(0,DUEL_Y+0.2,0)); }
  setTimeout(()=>{ bloom.strength = 0.6; }, 900);
}
function celebrate(holder){ if(!holder)return; const y0=holder.position.y;
  tween(560, p=>{ holder.position.y = y0 + Math.abs(Math.sin(p*Math.PI*2))*0.35; }); }
function droop(holder){ if(!holder)return;
  tween(600, p=>{ holder.rotation.z = -0.5*easeOut(p); holder.position.y = DUEL_Y - 0.35*easeOut(p); }); }

/* ---------- verdict UI ---------- */
function showVerdict(outcome, you, ai){
  const v = el('verdict');
  const map = { win:['VICTORY','var(--lime)'], lose:['DEFEAT','var(--red)'], draw:['STANDOFF','var(--gold)'] };
  const [txt,color] = map[outcome];
  v.style.color = color;
  v.innerHTML = `${txt}<small>YOU: ${NAMES[you]} &nbsp;·&nbsp; NEXUS: ${NAMES[ai]}</small>`;
  el('prompt').textContent = outcome==='win'?'NICE THROW — GO AGAIN':outcome==='lose'?'NEXUS TAKES IT':'DEAD EVEN';
  tween(400, p=>{ v.style.opacity=String(p); v.style.transform=`translateY(${(1-p)*20}px) scale(${0.9+0.1*back(p)})`; });
}
function hideVerdict(){ const v=el('verdict'); tween(250,p=>{ v.style.opacity=String(1-p); }); }

/* ============================================================= *
 *  INPUT
 * ============================================================= */
document.querySelectorAll('.btn').forEach(b=> b.addEventListener('click', ()=> play(b.dataset.move)) );
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='r') play('rock'); else if(k==='p') play('paper'); else if(k==='s') play('scissors');
});
// Click a 3D idle hand to play it — but only if it's a click, not a drag
// (so you can grab a hand to orbit without accidentally throwing).
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
const DRAG_TOL = 6;                 // px of movement allowed before it counts as a drag
let downHand = null, downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', ev=>{
  downHand = null;
  if(!idleGroup.visible || state.busy) return;
  downX = ev.clientX; downY = ev.clientY;
  mouse.x = (ev.clientX/innerWidth)*2-1; mouse.y = -(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(idleItems, true)[0];
  if(hit){ let o=hit.object; while(o && !o.userData.name) o=o.parent; if(o) downHand = o.userData.name; }
});
addEventListener('pointerup', ev=>{
  const hand = downHand; downHand = null;
  if(!hand || !idleGroup.visible || state.busy) return;
  if(Math.hypot(ev.clientX-downX, ev.clientY-downY) <= DRAG_TOL) play(hand);
});
addEventListener('pointercancel', ()=>{ downHand = null; });
el('muteBtn').addEventListener('click', ()=>{
  const m = !Audio.isMuted(); Audio.setMuted(m);
  el('muteBtn').textContent = m ? '♪ SOUND: OFF' : '♪ SOUND: ON';
});
el('resetBtn').addEventListener('click', ()=>{ state.you=state.ai=state.streak=state.best=0; paintScore(); saveStats(); });

/* ============================================================= *
 *  RESIZE + RENDER LOOP
 * ============================================================= */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if(idleGroup.visible){
    for(const h of idleItems){
      h.position.y = 1.7 + Math.sin(t*1.3 + h.userData.phase)*0.12;
      h.rotation.y = Math.sin(t*0.5 + h.userData.phase)*0.35;
    }
  }
  ringGlow.material.opacity = 0.35 + 0.2*Math.sin(t*2);
  updateBursts(dt);
  if(cameraLocked) camera.lookAt(controls.target);   // held front framing
  else controls.update();                             // idle orbit / user drag
  composer.render();
}

/* ============================================================= *
 *  BOOT
 * ============================================================= */
loadStats();
loop();
requestAnimationFrame(()=>{
  el('loadMsg').textContent = 'READY';
  el('ring').style.display='none';
  const sb = el('startBtn'); sb.style.display='inline-block';
  sb.addEventListener('click', ()=>{
    state.started = true;
    Audio.resume();
    el('loader').classList.add('hide');
    setTimeout(()=> el('loader').remove(), 700);
  });
});
window.addEventListener('error', (e)=>{
  if(!state.started && /three|module|import/i.test(String(e.message||''))){
    el('loadMsg').innerHTML = 'ENGINE FAILED TO LOAD.<br>Serve this over HTTP (GitHub Pages / local server), not file://';
    el('ring').style.display='none';
  }
});
</script>
</body>
