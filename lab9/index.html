<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Employee Details</h1>
  <p>Data loaded from <code>employees.xml</code></p>
  <button id="load">Load Employees</button>
  <p id="status"></p>
  <div class="table-wrap">
  <table id="emp-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Designation</th>
        <th>Email</th>
        <th>Salary (&#8377;)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  </div>
  <script src="script.js"></script>
</body>
</html>
